{% extends "base.html" %}
{% block title %}Apply — {{ property.unit_number }}{% endblock %}
{% block content %}
<h1>Application Form</h1>
<p class="subtitle">{{ property.property_type }} — {{ property.unit_number }} · QAR {{ property.monthly_rent|money }}/month</p>

{% if not session.get('role') %}
{% endif %}

<form method="POST" class="form-card">
    <label>Full Name *</label>
    <input type="text" name="full_name" value="{{ prefill.get('full_name','') }}" required>

    <label>Mobile *</label>
    <input type="tel" name="phone" value="{{ prefill.get('phone','') }}" required>

    <label>Email *</label>
    <input type="email" name="email" value="{{ prefill.get('email','') }}" required>

    <label>Nationality</label>
    <input type="text" name="nationality" value="{{ prefill.get('nationality','') }}">

    <label>Number of Occupants (max {{ property.maximum_occupants }})</label>
    <input type="number" name="occupants" value="{{ prefill.get('occupants', 1) }}" min="1" max="{{ property.maximum_occupants }}">

    <label>Move-in Date *</label>
    <input type="date" name="move_in" value="{{ prefill.get('move_in','') }}" required>

    <label>Rental Period (months)</label>
    <input type="number" name="rental_months" value="{{ prefill.get('rental_months', 12) }}" min="1">

    <button type="submit" class="button button-primary button-large">Continue →</button>
</form>
{% endblock %}
