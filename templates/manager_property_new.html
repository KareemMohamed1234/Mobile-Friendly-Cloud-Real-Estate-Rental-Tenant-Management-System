{% extends "manager_base.html" %}
{% block title %}Add Property{% endblock %}
{% block crumb %}{{ self.title() }}{% endblock %}
{% block content %}
<h1>Add Property</h1>
<form method="POST" class="form-card">
    <label>Building</label>
    <select name="building_id" id="building_id" onchange="document.getElementById('new-building').style.display = this.value === 'new' ? 'block' : 'none'" required>
        {% for b in buildings %}<option value="{{ b.id }}" {{ 'selected' if form.get('building_id') == b.id|string }}>{{ b.building_name }}{% if b.city %} — {{ b.city }}{% endif %}</option>{% endfor %}
        <option value="new" {{ 'selected' if form.get('building_id') == 'new' or not buildings }}>➕ New building…</option>
    </select>
    <div id="new-building" style="display: {{ 'block' if form.get('building_id') == 'new' or not buildings else 'none' }}">
        <label>New building name</label>
        <input type="text" name="new_building_name" value="{{ form.get('new_building_name','') }}">
        <label>Address</label>
        <input type="text" name="new_building_address" value="{{ form.get('new_building_address','') }}">
        <label>City</label>
        <input type="text" name="new_building_city" value="{{ form.get('new_building_city','') }}">
    </div>

    <label>Unit number *</label>
    <input type="text" name="unit_number" value="{{ form.get('unit_number','') }}" placeholder="e.g. A-203" required>

    <label>Property type *</label>
    <select name="property_type">
        {% for t in PROPERTY_TYPES %}<option {{ 'selected' if form.get('property_type') == t }}>{{ t }}</option>{% endfor %}
    </select>

    <div class="two-col">
        <div><label>Bedrooms</label><input type="number" name="bedrooms" min="0" value="{{ form.get('bedrooms', 1) }}"></div>
        <div><label>Bathrooms</label><input type="number" name="bathrooms" min="1" value="{{ form.get('bathrooms', 1) }}"></div>
    </div>
    <div class="two-col">
        <div><label>Monthly rent (QAR) *</label><input type="number" step="0.01" name="monthly_rent" value="{{ form.get('monthly_rent','') }}" required></div>
        <div><label>Security deposit</label><input type="number" step="0.01" name="security_deposit" value="{{ form.get('security_deposit', 0) }}"></div>
    </div>
    <label>Maximum occupants</label>
    <input type="number" name="maximum_occupants" min="1" value="{{ form.get('maximum_occupants', 2) }}">
    <label>Description</label>
    <textarea name="description" rows="4">{{ form.get('description','') }}</textarea>
    <button type="submit" class="button button-primary button-large">Create &amp; add photos →</button>
</form>
{% endblock %}
