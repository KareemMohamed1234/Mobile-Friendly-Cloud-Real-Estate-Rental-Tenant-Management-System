{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="POST" class="form-card" data-auth-form>
    <label for="current">Current password</label>
    <input type="password" id="current" name="current" autocomplete="current-password" required>
    <label for="password">New password <span class="text-muted">(at least 8 characters)</span></label>
    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
    <button type="submit" class="button button-primary">Save password</button>
</form>
{% endblock %}
